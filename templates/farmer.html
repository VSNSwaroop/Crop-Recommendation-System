<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Farmer Dashboard</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
    <style>
      .result-box { margin-top: 2em; padding: 1em; border-radius: 8px; background: #f7f7f7; }
    </style>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-light bg-success">
  <a class="navbar-brand text-white" href="{{ url_for('farmer') }}">Farmer Dashboard</a>
  <div class="ml-auto">
    <a href="{{ url_for('logout') }}" class="btn btn-outline-light">Logout</a>
  </div>
</nav>
<div class="container mt-5" style="max-width: 520px;">
    <h3>Welcome, {{ user.email }}!</h3>
    <p class="text-muted">Upload a soil image and enter weather values to get a crop recommendation.</p>
    <hr>
    <form id="predict-form" enctype="multipart/form-data">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="form-group">
            <label for="soil_image">Soil Image</label>
            <input type="file" class="form-control" id="soil_image" name="soil_image" accept="image/jpeg,image/png,image/webp" required>
        </div>
        <div class="form-group">
            <label for="temperature">Temperature (°C)</label>
            <input type="number" class="form-control" id="temperature" name="temperature" min="-50" max="70" step="0.1" required>
        </div>
        <div class="form-group">
            <label for="rainfall">Rainfall (mm)</label>
            <input type="number" class="form-control" id="rainfall" name="rainfall" min="0" max="10000" step="0.1" required>
        </div>
        <button type="submit" class="btn btn-primary btn-block">Predict Crop</button>
    </form>
    <div class="result-box" id="result" style="display:none;"></div>
    <div class="alert alert-danger mt-3" id="error" style="display:none;"></div>
</div>
<script>
  function fetchWeather(lat, lon) {
    const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current_weather=true&daily=precipitation_sum&timezone=auto`;
    fetch(url)
      .then(res => res.json())
      .then(data => {
        if (data.current_weather && data.daily) {
          document.getElementById('temperature').value = data.current_weather.temperature;
          document.getElementById('rainfall').value = data.daily.precipitation_sum[0];
        }
      })
      .catch(() => {});
  }

  window.onload = function() {
    if (navigator.geolocation) {
      navigator.geolocation.getCurrentPosition(
        pos => fetchWeather(pos.coords.latitude, pos.coords.longitude),
        () => {}
      );
    }
  };

  document.getElementById('predict-form').addEventListener('submit', async function(e) {
    e.preventDefault();
    const result = document.getElementById('result');
    const error = document.getElementById('error');
    result.style.display = 'none';
    error.style.display = 'none';

    try {
      const response = await fetch('/predict', { method: 'POST', body: new FormData(this) });
      const data = await response.json();

      if (response.ok) {
        const soilPct = (data.soil_confidence * 100).toFixed(1);
        const cropPct = (data.crop_confidence * 100).toFixed(1);
        result.innerHTML =
          `<strong>Predicted Crop:</strong> ${data.predicted_crop}<br>` +
          `<strong>Detected Soil:</strong> ${data.soil_type}<br>` +
          `<small class="text-muted">Model confidence — soil: ${soilPct}%, crop: ${cropPct}%</small>`;
        result.style.display = 'block';
      } else {
        error.textContent = data.error || 'Prediction failed.';
        error.style.display = 'block';
      }
    } catch (err) {
      error.textContent = 'Error connecting to server.';
      error.style.display = 'block';
    }
  });
</script>
</body>
</html>
