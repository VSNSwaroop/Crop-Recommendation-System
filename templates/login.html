<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login | Crop Recommendation System</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-light bg-success">
  <a class="navbar-brand text-white" href="{{ url_for('login') }}">Crop Recommendation System</a>
  <div class="ml-auto">
    <a href="{{ url_for('register') }}" class="btn btn-outline-light">Register</a>
  </div>
</nav>
<div class="container" style="max-width: 420px; margin-top: 60px;">
    <h2 class="text-center mb-4">Login</h2>
    {% with messages = get_flashed_messages() %}
      {% if messages %}
        <div class="alert alert-warning">{{ messages[0] }}</div>
      {% endif %}
    {% endwith %}
    <form method="POST">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="form-group">
            <label for="email">Email address</label>
            <input id="email" type="email" name="email" class="form-control" required autocomplete="email" autofocus>
        </div>
        <div class="form-group">
            <label for="password">Password</label>
            <input id="password" type="password" name="password" class="form-control" required autocomplete="current-password">
        </div>
        <button type="submit" class="btn btn-success btn-block">Login</button>
    </form>
    <div class="text-center mt-3">
        <a href="{{ url_for('register') }}">Create an account</a>
    </div>
</div>
</body>
</html>
