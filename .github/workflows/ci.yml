name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install lightweight test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install "Flask>=3,<4" "Flask-Login>=0.6,<1" "Flask-SQLAlchemy>=3.1,<4" "Flask-WTF>=1.2,<2" "Werkzeug>=3,<4" "python-dotenv>=1,<2"

      - name: Static checks
        run: ruff check .

      - name: Compile Python sources
        run: python -m compileall -q app.py train_crop_model.py train_soil_cnn.py

      - name: Run tests
        run: pytest -q
